# Nixpacks config para EasyPanel / Railway / Coolify
# Next.js 16 + pnpm 11.1.1 sobre Node 22.
# Node 20 quebra com `ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING` no corepack,
# por isso evitamos corepack e instalamos o pnpm via npm.

providers = ["node"]

[variables]
NODE_ENV = "production"
NPM_CONFIG_PRODUCTION = "false"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "npm install -g pnpm@11.1.1",
  "pnpm install --frozen-lockfile",
]

[phases.build]
cmds = ["pnpm build"]

[start]
cmd = "pnpm start"
