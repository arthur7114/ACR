# Nixpacks config para EasyPanel / Railway / Coolify
# pnpm + Next.js 16 production build

providers = ["node"]

[variables]
NODE_ENV = "production"
NPM_CONFIG_PRODUCTION = "false"

[phases.setup]
nixPkgs = ["nodejs_20", "pnpm-9_x"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@11.1.1 --activate",
  "pnpm install --frozen-lockfile",
]

[phases.build]
cmds = ["pnpm build"]

[start]
cmd = "pnpm start"
